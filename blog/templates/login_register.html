{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login / Register</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display&family=Lora&family=Poppins&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'login_register.css' %}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"/>
</head>
<body>

<div class="main">
    <div class="first-container">
        <div class="form-1">
          <button id="loginToggle" class="active">Login</button>
          <button id="registerToggle">Register</button>
        </div>

        <div id="loginForm" class="form-box">
          <h2>Login</h2>
          <form action="{% url 'login_view' %}" method="POST">
              {% csrf_token %}
            <input type="text" name="email" placeholder="Email" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Login</button>
          </form>
        </div>

        <div id="registerForm" class="form-2 hidden">
          <h2>Register</h2>
          <form action="{% url 'login_register' %}" method="POST">
              {% csrf_token %}
            <input type="text" name="name" placeholder="Full Name" required>
            <input type="email" name="email" placeholder="Email" required>
            <input type="password" name="password" placeholder="Password" required>
            <input type="tel" name="phone" placeholder="Phone Number" pattern="[0-9]+" required>
            <button type="submit">Register</button>
          </form>
        </div>
    </div>
</div>

  <script>
    
    let loginBtn = document.getElementById("loginToggle");
    let registerBtn = document.getElementById("registerToggle");
    let loginForm = document.getElementById("loginForm");
    let registerForm = document.getElementById("registerForm");

    
    loginBtn.onclick = function () {
    loginForm.style.display = "block";
    registerForm.style.display = "none";

    loginBtn.classList.add("active");
    registerBtn.classList.remove("active");
    };

    
    registerBtn.onclick = function () {
    registerForm.style.display = "block";
    loginForm.style.display = "none";

    registerBtn.classList.add("active");
    loginBtn.classList.remove("active");
    };

  </script>
</body>
</html>
