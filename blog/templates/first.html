{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'first.css' %}">
    <title>Inkverge</title>
</head>
<body>


        
    <div class="nav">
        <div class="nav-left">
            <a href="{% url 'first' %}"><img class="logo" src="{% static 'image/logo-2.png' %}" alt="Inkverge Logo"></a>
        </div>
        <div class="nav-right">
            <a href="{% url 'about' %}">Our Story</a>
            {% if user.is_authenticated %}
            <a href="{% url 'logout_view' %}">Sign Out</a>
            {% else %}
            <a href="{% url 'login_register' %}">Sign in</a>
            {% endif %}
        </div>
    </div>
    <div class="main">
        <div class="fr-row">
            <div class="left">
                <h1>Traveling stories & ideas</h1>
                <p>A place to read, write, and deepen your understanding</p>
                <div class="read">
                    <a href="{% url 'login_register' %}">Start reading</a>
                </div>
            </div>
            <div class="right">
                <img src="../static/image/home.webp" alt="flower">
            </div>
        </div>
    </div>
  

</body>

</html>
